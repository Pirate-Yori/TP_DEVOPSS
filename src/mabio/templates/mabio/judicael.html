<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Judical, étudiant en cybersécurité</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #F5F6F8; --ink: #12161C; --muted: #5C6470; --accent: #2D4BFF; }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 8vw 6vw;
    background: var(--bg); color: var(--ink);
    font: 400 clamp(1.05rem, 2vw, 1.3rem)/1.6 "Figtree", "Segoe UI", system-ui, sans-serif;
  }
  main { max-width: 38rem; }
  h1 {
    font: 800 clamp(3.5rem, 14vw, 7rem)/1 "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    letter-spacing: -.03em;
  }
  h1::after {
    content: ""; display: inline-block; width: .12em; height: .8em; margin-left: .08em;
    background: var(--accent); animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .role { margin-top: .8rem; font-weight: 600; color: var(--accent); }
  p { margin-top: 1.6rem; color: var(--muted); }
  ul { list-style: none; padding: 0; margin-top: 2rem; display: flex; flex-wrap: wrap; gap: .6rem; }
  li { border: 2px solid var(--ink); border-radius: 999px; padding: .15rem 1rem; font-size: .85em; font-weight: 600; }
  a {
    display: inline-block; margin-top: 2.4rem; color: var(--ink); font-weight: 600;
    text-decoration: none; border-bottom: 3px solid var(--accent);
  }
  a:hover { color: var(--accent); }
  a:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
  @media (prefers-reduced-motion: reduce) { h1::after { animation: none; } }
</style>
</head>
<body>
<main>
  <h1>Judical</h1>
  <div class="role">Étudiant en cybersécurité</div>
  <p>J'apprends la sécurité en pratiquant : je monte des labs, je casse puis je répare, et je documente ce que je découvre sur ce profil.</p>
  <ul>
    <li>Réseaux</li>
    <li>Sécurité offensive</li>
    <li>DevOps</li>
    <li>Python</li>
  </ul>
  <a href="https://github.com/votre-pseudo">Voir mes projets sur GitHub</a>
</main>
</body>
</html>
